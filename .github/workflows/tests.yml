# Unit-Tests — bis 27.08.2026 hatte cw-core ueberhaupt keine CI.
#
# `.github/` war leer, bei 665 Testfaellen und 22 abhaengigen Kundenrepos, die
# cw-core als Tarball ziehen. Ein roter Test hat hier nie jemanden aufgehalten.
#
# Was das gekostet hat, laesst sich am selben Tag ablesen: der OG-Commit
# c71e0645 (v0.132.0, 14:37) aenderte package.json, ohne pnpm-lock.yaml
# mitzuziehen. Danach brach `pnpm install --frozen-lockfile` auf dem
# Default-Branch ab, und fuenf og-Tests waren rot, weil satori nicht mehr
# installiert wurde. Beides waere hier binnen Minuten aufgefallen.
#
# `pnpm check` (astro check) laeuft mit. Beim ersten Anlauf war er rot — vier
# Typfehler, zwei davon aus demselben Commit c71e0645 — und stand deshalb kurz
# ausserhalb des Gates. Sie sind im selben Zweig behoben (#84), also ist der
# Schritt jetzt drin. Ein `continue-on-error` waere die falsche Antwort gewesen:
# das ergaebe genau die Fassade, gegen die dieser Workflow gebaut wird.

name: Tests

on:
  push:
    branches: [release/cw-core]
  pull_request:
    branches: [release/cw-core]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # cw-core hat kein packageManager-Feld, aus dem die Action lesen
          # koennte. 9 ist die Fassung, mit der pnpm-lock.yaml erzeugt wurde.
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Die Version, unter der cw-core in der Produktion laeuft: die
          # Kunden-Builds (build-check.yml, aus cw-core/templates/) fahren 22.
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile ist hier selbst ein Gate: es faellt aus, sobald
      # package.json und Lockfile auseinanderlaufen. Genau das war am
      # 27.08.2026 ueber Stunden der Fall, ohne dass es jemandem auffiel.
      - run: pnpm install --frozen-lockfile

      # Die Zaehlzeile ("# tests 665") muss im Log stehen. Ein gruener Haken
      # allein sagt nicht, ob ueberhaupt etwas lief.
      - name: pnpm test (669 Faelle erwartet, Stand 27.08.2026)
        run: pnpm test

      # Nach den Tests, nicht davor: ein Typfehler ist billiger zu lesen, wenn
      # man vorher weiss, ob das Verhalten stimmt.
      - name: pnpm check (astro check — 0 errors erwartet)
        run: pnpm check

  # ── Guard fuer die Guards ───────────────────────────────────────────────────
  # checks/ wird von templates/.github/workflows/site-checks.yml in JEDEM
  # Kundenrepo ausgecheckt und gefahren. Ein Tippfehler oder ein kaputter Import
  # dort bricht damit nicht ein Repo, sondern alle 23 gleichzeitig — und zwar
  # erst dann, wenn dort das naechste Mal jemand pusht.
  #
  # Dieser Job faengt das hier: er installiert checks/ und laesst Playwright die
  # Tests AUFZAEHLEN. Das laedt playwright.config.ts, beide Specs und seiten.ts,
  # ohne einen Browser zu starten (~20 s).
  #
  # Ohne DIST_DIR findet seiten.ts keine sitemap-0.xml und faellt bewusst auf den
  # Kern zurueck (2 Routen); die erwartete Summe steht am Schritt unten. Die Zahl wird
  # geprueft, nicht
  # nur der Exit-Code — genau hier lag die teuerste Falle: unter Node 26 lieferte
  # @playwright/test 1.52.0 Exit 0 und NULL Tests, ohne eine Zeile Ausgabe. Ein
  # Lauf, der nichts geprueft hat, sieht sonst aus wie ein bestandener.
  guards:
    name: checks/ laedt und zaehlt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # checks/ hat ein eigenes packageManager-Feld (pnpm@10.0.0) — dasselbe,
          # das die Kundenrepos pinnen. Die Wurzel von cw-core steht auf 9; die
          # beiden Jobs teilen sich deshalb bewusst keine pnpm-Fassung.
          package_json_file: checks/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: checks/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: checks

      # Seit v0.150.0 (layout-audit) waren es 17 Tests, seit dem Skip-Link-Guard (#216) 19, seit dem Formularkontrast-Guard (#213) sind es 21:
      #   mobile + tablet: mobile-audit 2 + a11y-audit 2 + formular-kontrast 1 + skip-link 1 + layout-audit 3 (Positivkontrolle + 2 Routen) = 9 x 2 = 18
      #   desktop: nur layout-audit (testMatch) = 3
      # Zusaetzlich geprueft: im Projekt desktop taucht KEINE andere Spec auf — sonst liefe
      # mobile-audit dort doppelt und a11y-audit mit einem Viewport, fuer den sie nie
      # kalibriert wurde.
      - name: Specs aufzaehlen (21 Tests erwartet — Kern-Rueckfall ohne DIST_DIR)
        working-directory: checks
        run: |
          set -euo pipefail
          AUSGABE=$(pnpm exec playwright test --project=mobile --project=tablet --project=desktop --list)
          echo "$AUSGABE"
          ANZAHL=$(echo "$AUSGABE" | grep -oE 'Total: [0-9]+ test' | grep -oE '[0-9]+' || echo 0)
          echo "gezaehlt: $ANZAHL"
          if [ "${ANZAHL:-0}" -ne 21 ]; then
            echo "::error::Erwartet waren 21 Tests (mobile+tablet je 9, desktop 3), gezaehlt: $ANZAHL"
            exit 1
          fi
          FREMD=$(echo "$AUSGABE" | grep -E '\[desktop\]' | grep -vc 'layout-audit.spec.ts' || true)
          if [ "${FREMD:-0}" -ne 0 ]; then
            echo "::error::Projekt desktop enthaelt $FREMD Tests ausserhalb von layout-audit"
            exit 1
          fi
          # Rueckfall-Guard (Review nach dem Merge von #219, Befund 3): der Zaehlwert allein sieht nicht, ob
          # `--list` nebenbei node:test-Dateien ausgefuehrt hat — vor #219 stand Total 19 neben 17 Ergebniszeilen
          # von node:test. Null solcher Zeilen, sonst rot. (grep -c endet ohne Treffer mit 1, daher || true.)
          NODETEST=$(echo "$AUSGABE" | grep -cE '^\s*(✔|✖|ok [0-9]|not ok)' || true)
          echo "node:test-Zeilen in der --list-Ausgabe: ${NODETEST:-0}"
          if [ "${NODETEST:-0}" -ne 0 ]; then
            echo "::error::$NODETEST node:test-Ergebniszeilen in der --list-Ausgabe — testMatch in playwright.config.ts greift nicht"
            exit 1
          fi

      # Die node:test-Dateien in checks/ liefen bis #219 nur versehentlich beim --list mit (Ergebnis ignoriert,
      # 7 „not ok“ ohne Chromium), seit #219 in keinem Job (Review nach dem Merge, Befund 4). Hier laufen sie als
      # eigener Schritt: check-slop (npx impeccable, braucht Netz), formular-kontrast und screenshot-gescrollt
      # (beide Chromium). Die Wurzel-Globs von `pnpm test` erfassen checks/ nicht.
      - name: node:test in checks/ (check-slop, formular-kontrast, screenshot-gescrollt)
        working-directory: checks
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm test:slop
          pnpm test:formular
          pnpm test:screens

  # Formulare im Browser wirklich absenden (blitzsicht-ops#900): Klick →
  # Client-Skript in ContactForm.astro → echter createContactHandler → Erfolgs-
  # oder Fehlerblock. examples/ wird statisch gebaut, der POST im Browser
  # abgefangen, nach außen geht nichts (fetch im Test-Prozess ist ersetzt).
  # Eigenes Paket e2e/ statt checks/, weil checks/ in jedem Kundenrepo läuft.
  e2e:
    name: e2e Formulare absenden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Alle drei Lockfiles (Wurzel, examples, e2e) stammen aus pnpm 9, wie im Job test.
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            examples/pnpm-lock.yaml
            pnpm-lock.yaml

      # Wurzel zuerst: examples verlinkt @cw/core per link:.. und braucht dessen Abhängigkeiten.
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: examples
      - run: pnpm install --frozen-lockfile
        working-directory: e2e

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e

      - run: pnpm --dir examples build

      # 7 Formular-Tests + 3 ScrollProgress (kein scrollHeight beim Laden, 09.11.2026)
      - name: Formulare absenden und ScrollProgress (10 Tests erwartet)
        working-directory: e2e
        run: |
          set -euo pipefail
          pnpm exec playwright test | tee ausgabe.txt
          ANZAHL=$(grep -oE '[0-9]+ passed' ausgabe.txt | grep -oE '[0-9]+' || echo 0)
          if [ "${ANZAHL:-0}" -ne 10 ]; then
            echo "::error::Erwartet waren 10 bestandene Tests, gezaehlt: $ANZAHL"
            exit 1
          fi
