# Unit-Tests — bis 27.08.2026 hatte cw-core ueberhaupt keine CI.
#
# `.github/` war leer, bei 665 Testfaellen und 22 abhaengigen Kundenrepos, die
# cw-core als Tarball ziehen. Ein roter Test hat hier nie jemanden aufgehalten.
#
# Was das gekostet hat, laesst sich am selben Tag ablesen: der OG-Commit
# c71e0645 (v0.132.0, 14:37) aenderte package.json, ohne pnpm-lock.yaml
# mitzuziehen. Danach brach `pnpm install --frozen-lockfile` auf dem
# Default-Branch ab, und fuenf og-Tests waren rot, weil satori nicht mehr
# installiert wurde. Beides waere hier binnen Minuten aufgefallen.
#
# `pnpm check` (astro check) laeuft mit. Beim ersten Anlauf war er rot — vier
# Typfehler, zwei davon aus demselben Commit c71e0645 — und stand deshalb kurz
# ausserhalb des Gates. Sie sind im selben Zweig behoben (#84), also ist der
# Schritt jetzt drin. Ein `continue-on-error` waere die falsche Antwort gewesen:
# das ergaebe genau die Fassade, gegen die dieser Workflow gebaut wird.

name: Tests

on:
  push:
    branches: [release/cw-core]
  pull_request:
    branches: [release/cw-core]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # cw-core hat kein packageManager-Feld, aus dem die Action lesen
          # koennte. 9 ist die Fassung, mit der pnpm-lock.yaml erzeugt wurde.
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Die Version, unter der cw-core in der Produktion laeuft: die
          # Kunden-Builds (build-check.yml, aus cw-core/templates/) fahren 22.
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile ist hier selbst ein Gate: es faellt aus, sobald
      # package.json und Lockfile auseinanderlaufen. Genau das war am
      # 27.08.2026 ueber Stunden der Fall, ohne dass es jemandem auffiel.
      - run: pnpm install --frozen-lockfile

      # Die Zaehlzeile ("# tests 665") muss im Log stehen. Ein gruener Haken
      # allein sagt nicht, ob ueberhaupt etwas lief.
      - name: pnpm test (669 Faelle erwartet, Stand 27.08.2026)
        run: pnpm test

      # Nach den Tests, nicht davor: ein Typfehler ist billiger zu lesen, wenn
      # man vorher weiss, ob das Verhalten stimmt.
      - name: pnpm check (astro check — 0 errors erwartet)
        run: pnpm check

  # ── Guard fuer die Guards ───────────────────────────────────────────────────
  # checks/ wird von templates/.github/workflows/site-checks.yml in JEDEM
  # Kundenrepo ausgecheckt und gefahren. Ein Tippfehler oder ein kaputter Import
  # dort bricht damit nicht ein Repo, sondern alle 23 gleichzeitig — und zwar
  # erst dann, wenn dort das naechste Mal jemand pusht.
  #
  # Dieser Job faengt das hier: er installiert checks/ und laesst Playwright die
  # Tests AUFZAEHLEN. Das laedt playwright.config.ts, beide Specs und seiten.ts,
  # ohne einen Browser zu starten (~20 s).
  #
  # Ohne DIST_DIR findet seiten.ts keine sitemap-0.xml und faellt bewusst auf den
  # Kern zurueck: 2 Specs x 2 Routen x 2 Projekte = 8 Tests. Die Zahl wird
  # geprueft, nicht
  # nur der Exit-Code — genau hier lag die teuerste Falle: unter Node 26 lieferte
  # @playwright/test 1.52.0 Exit 0 und NULL Tests, ohne eine Zeile Ausgabe. Ein
  # Lauf, der nichts geprueft hat, sieht sonst aus wie ein bestandener.
  guards:
    name: checks/ laedt und zaehlt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # checks/ hat ein eigenes packageManager-Feld (pnpm@10.0.0) — dasselbe,
          # das die Kundenrepos pinnen. Die Wurzel von cw-core steht auf 9; die
          # beiden Jobs teilen sich deshalb bewusst keine pnpm-Fassung.
          package_json_file: checks/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: checks/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: checks

      - name: Specs aufzaehlen (8 Tests erwartet — Kern-Rueckfall ohne DIST_DIR)
        working-directory: checks
        run: |
          set -euo pipefail
          AUSGABE=$(pnpm exec playwright test --project=mobile --project=tablet --list)
          echo "$AUSGABE"
          ANZAHL=$(echo "$AUSGABE" | grep -oE 'Total: [0-9]+ test' | grep -oE '[0-9]+' || echo 0)
          echo "gezaehlt: $ANZAHL"
          if [ "${ANZAHL:-0}" -ne 8 ]; then
            echo "::error::Erwartet waren 8 Tests (2 Specs x 2 Kern-Routen x 2 Viewports), gezaehlt: $ANZAHL"
            exit 1
          fi
