# Site Checks — Customer-Website-Guards
#
# Prüft den FRISCH GEBAUTEN Build auf mobile Tauglichkeit (kein horizontaler
# Überstand, keine Bilder breiter als der Viewport) und auf Barrierefreiheit
# (axe-core, WCAG 2.x AA).
#
# Vorlage: cw-core/templates/.github/workflows/site-checks.yml
# Ausgerollt über: customer-websites/scripts/rollout-site-checks.sh
# NICHT hier im Kundenrepo bearbeiten — Änderungen gehen an der Vorlage
# verloren, sobald das Rollout-Skript erneut läuft.
#
# ── Warum hier kein Screenshot-Vergleich läuft (Stand 07.08.2026) ────────────
# Bis dahin lief zusätzlich ein Pixelvergleich gegen gespeicherte Baselines. Er
# war in 330 Läufen seit dem 26.04.2026 KEIN EINZIGES MAL grün (255 failure,
# 75 cancelled, 0 success). Ursache war nicht ein Bug, sondern die Konstruktion:
# er feuerte bei Kunden-Commits, während Baselines nur über einen
# cw-core-gebundenen Workflow erneuert werden konnten — und der lag seit dem
# 18.04.2026 still. Jeder neue Blogartikel machte ihn dauerhaft rot.
# Der Schutz, um den es dabei ging ("bricht etwas, WEIL wir im Core was
# ändern"), lebt in cw-visual-tests als A/B-Gate: dieselbe Kundenseite zweimal
# bauen, alter Core gegen Kandidat, diffen. Keine Baselines, nichts das
# veraltet.
#
# ── Warum die Specs aus cw-core kommen ───────────────────────────────────────
# cw-core ist PUBLIC — actions/checkout holt es ohne Schlüssel. Die Specs lagen
# vorher in cw-visual-tests (privat) und brauchten einen Deploy-Key als
# Repo-Secret. Bei 23 Repos wären das 23 Geheimnis-Stellen und 23
# Ausfallmöglichkeiten; zwei solche Ausfälle sind belegt (abgelaufenes PAT,
# 03.–07.08.2026; Deploy-Key-Autorisierung nach dem Org-Umzug ab 25.08.2026 —
# der GitHub-Redirect trägt git und die REST-API, aber nicht SSH). Org-Secrets
# wären die Alternative: die Organisation liegt auf dem Free-Plan, der kennt
# keine Org-Secrets für private Repos.

name: Site Checks

# Kein `push`-Ausloeser — und das ist eine Kostenentscheidung, keine Nachlaessigkeit.
#
# Die Organisation liegt auf dem Free-Plan: 2.000 Actions-Minuten im Monat fuer
# private Repos, Ausgabenlimit 0. Am 28.08.2026 war der August bei rund 5.860
# Minuten-Aequivalenten (3.153 Linux, 325 Windows x2, 206 macOS x10), und ab da
# starteten Jobs gar nicht mehr: Ergebnis "failure", null ausgefuehrte Schritte,
# GitHub selbst stoerungsfrei.
#
# Ein Lauf dieses Workflows dauert drei bis fuenf Minuten. Bei 22 Repos und
# jedem Push waere er dauerhaft teurer, als der Plan hergibt.
#
# Geprueft wird deshalb dort, wo eine rote Meldung noch etwas aendert: VOR dem
# Merge. Dieselbe Seite nach dem Merge ein zweites Mal zu messen bringt keinen
# neuen Befund.
#
# Preis dieser Wahl: wer direkt auf main pusht, wird nicht geprueft. Das betrifft
# vor allem scripts/rollout-site-checks.sh selbst — eine Aenderung an dieser
# Vorlage laeuft danach erst beim naechsten PR eines Kunden. Wer sie sofort
# pruefen will, nimmt workflow_dispatch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── Die einzige Stelle, an der der cw-core-Pin steht ─────────────────────
    # Vorher stand der Tag zweimal in dieser Datei (am checkout-Step und in der
    # Log-Zeile) und musste von cw-release Schritt 6b zweimal gehoben werden.
    # Zwei Fundstellen für dieselbe Tatsache heißt: eine davon veraltet
    # irgendwann still, und dann meldet das Protokoll einen Tag, gegen den gar
    # nicht geprüft wurde — ein Beleg, der schlechter ist als keiner.
    # Gehoben wird das hier von cw-release Schritt 6b, nicht von Hand.
    env:
      CW_CORE_PIN: release/cw-core/v0.149.2

    steps:
      - name: Kundenrepo auschecken
        uses: actions/checkout@v4
        with:
          path: site

      - name: cw-core auschecken (public — kein Schlüssel nötig)
        uses: actions/checkout@v4
        with:
          repository: blitzsicht/cw-core
          # Fester Tag, kein Branch-Kopf. Das Kundenrepo pinnt cw-core als
          # Bibliothek exakt (@cw/core in package.json) — also muss der Prüfer
          # genauso fest stehen, sonst ist kein Lauf mit einem anderen
          # vergleichbar. Belegt am 28.08.2026: auf customer-gympanzen@43ec4d4
          # standen 7 grüne gegen 3 rote Läufe bei gleichem Kunden-Commit, weil
          # drei cw-core-Commits (#94, #95, #96) ins Messfenster fielen und
          # `release/cw-core` mitwanderte.
          # Der Default-Branch von cw-core IST release/cw-core; main trägt nur
          # einen Deprecation-Guard. Der Tag liegt deshalb unter demselben
          # Präfix — refs/tags/release/cw-core/vX.Y.Z, nicht refs/heads.
          # Gehoben wird dieser Pin vom cw-release-Skill, nicht von Hand.
          # Der Wert steht im env-Block oben — hier steht bewusst kein Literal.
          ref: ${{ env.CW_CORE_PIN }}
          path: cw-core

      - name: Guard-Stand protokollieren und prüfen
        # Drei Dinge in einem Schritt, alle drei aus einem Vorfall heraus:
        #
        # 1. PROTOKOLL. Ohne diese Zeile ist im Nachhinein nicht feststellbar,
        #    gegen welche Spec-Fassung ein Lauf geurteilt hat. Die Diagnose vom
        #    28.08.2026 war nur über den Vergleich von Zeilennummern in
        #    Fehlertexten möglich — Stunden statt Sekunden.
        #
        # 2. HARTE PRÜFUNG: ist der ausgecheckte Commit wirklich der, den der
        #    Pin meint? Löst ${{ env.CW_CORE_PIN }} oben aus irgendeinem Grund
        #    nicht auf, nimmt actions/checkout STILL den Default-Branch — und
        #    der ist release/cw-core, also exakt der bewegliche Branch-Kopf, an
        #    dem der Guard vorher krankte. Ein solcher Rückfall sähe in der
        #    Oberfläche aus wie ein normaler grüner Lauf. Deshalb Abbruch.
        #
        # 3. WEICHE PRÜFUNG: ist der Pin noch der neueste Tag? Wird cw-release
        #    Schritt 6b übersprungen, prüft die ganze Flotte weiter mit dem Spec
        #    der Vorversion — und niemand sieht es, weil Vorlage und Kundenrepos
        #    dann einvernehmlich veraltet sind. Nur eine Warnung: zwischen
        #    Tag-Push und Rollout liegen ein paar Minuten, und in dieser Zeit
        #    darf kein Kunden-PR rot werden. Die harte Variante dieser Prüfung
        #    läuft in customer-websites (rollout-site-checks.sh --check).
        run: |
          set -uo pipefail
          IST=$(git -C cw-core rev-parse HEAD)
          echo "Guard-Specs: ${CW_CORE_PIN} = $(git -C cw-core rev-parse --short HEAD)"

          # Auflösung des Pins auf einen Commit. actions/checkout holt per Default
          # nur einen Commit; ob der Tag lokal ueberhaupt vorliegt, ist damit
          # nicht gesichert. Deshalb erst lokal, dann remote.
          SOLL=$(git -C cw-core rev-list -n 1 "refs/tags/${CW_CORE_PIN}" 2>/dev/null || true)
          if [ -z "$SOLL" ]; then
            # ^{} liefert bei einem annotated tag den Commit statt des Tag-Objekts.
            # sort -k2 stellt die ^{}-Zeile ans Ende, tail nimmt sie; bei einem
            # lightweight tag gibt es nur eine Zeile und dieselbe Logik greift.
            # `|| true` ist noetig, NICHT Zierde: GitHub startet diesen Schritt als
            # `bash -e` (im Log-Kopf nachlesbar), und `set -uo pipefail` hebt das -e
            # nicht auf. Findet die Pipeline nichts, ist der Exit-Status der
            # ZUWEISUNG 1 und der Schritt bricht ab — ausgerechnet dann, wenn der
            # dritte Zustand darunter greifen soll. Gleiche Falle wie beim
            # Sitemap-Zaehler weiter unten, dort schon einmal teuer bezahlt.
            SOLL=$( { git ls-remote https://github.com/blitzsicht/cw-core \
                        "refs/tags/${CW_CORE_PIN}" "refs/tags/${CW_CORE_PIN}^{}" 2>/dev/null \
                      | sort -k2 | tail -1 | cut -f1; } || true)
          fi
          if [ -z "$SOLL" ]; then
            # Werkzeugversagen ist weder gruen noch rot. Ein nicht aufloesbarer
            # Pin darf keinen Kunden-PR blockieren, aber auch nicht so aussehen,
            # als waere geprueft worden.
            echo "::warning::Pin ${CW_CORE_PIN} war weder lokal noch remote aufloesbar — der Checkout wurde NICHT gegen den Pin geprueft."
          elif [ "$IST" != "$SOLL" ]; then
            echo "::error::cw-core steht auf $IST, der Pin ${CW_CORE_PIN} meint $SOLL. Der Checkout ist NICHT auf dem gepinnten Tag — vermutlich ist die Auflösung auf den Default-Branch zurückgefallen. Kein Urteil aus diesem Lauf ist mit einem anderen vergleichbar."
            exit 1
          else
            echo "Pin bestätigt: ausgecheckter Commit == Tag ${CW_CORE_PIN}"
          fi

          # Aktualität. Fehlschlag hier ist kein Fehler, aber auch kein Schweigen:
          # eine nicht ermittelbare Referenz wird benannt statt als "aktuell" gewertet.
          # Auch hier `|| true` — siehe oben. Ohne den Auffang waere der Warn-Zweig
          # darunter unerreichbar, und ein Netzfehler faerbte jeden Kunden-PR rot.
          NEUESTER=$( { git ls-remote --tags https://github.com/blitzsicht/cw-core 'refs/tags/release/cw-core/v*' 2>/dev/null \
              | sed 's#.*refs/tags/##' \
              | grep -E '^release/cw-core/v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1; } || true)
          if [ -z "$NEUESTER" ]; then
            echo "::warning::Neuester cw-core-Tag nicht ermittelbar — die Aktualität des Pins wurde NICHT geprüft."
          elif [ "$NEUESTER" != "${CW_CORE_PIN}" ]; then
            echo "::warning::Der Guard prüft mit ${CW_CORE_PIN}, neuester Tag ist ${NEUESTER}. In customer-websites: ./scripts/rollout-site-checks.sh --check"
          else
            echo "Pin ist der neueste Tag."
          fi

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          # Version kommt aus dem `packageManager`-Feld des Kundenrepos. Kein
          # zusätzliches `version:` — eine doppelte Definition löst seit
          # action-setup@v4 ERR_PNPM_BAD_PM_VERSION aus.
          package_json_file: site/package.json

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            site/pnpm-lock.yaml
            cw-core/checks/pnpm-lock.yaml

      - name: Abhängigkeiten der Kundenseite installieren
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Kundenseite bauen
        run: pnpm build
        working-directory: site

      - name: Web-Root des Builds bestimmen
        id: webroot
        # Repos mit Vercel-Adapter (output: 'static', adapter: vercel()) legen
        # die Site-Root unter dist/client ab; dist/ enthält daneben die
        # Function-Bundles und ist KEIN gültiger Web-Root — absolute Asset-Pfade
        # wie /logo.svg 404en dort. Stand 28.08.2026 betrifft das genau ein Repo
        # von 23, deshalb wird das ermittelt statt gesetzt.
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/site/dist/client" ]; then
            ROOT="$GITHUB_WORKSPACE/site/dist/client"
          else
            ROOT="$GITHUB_WORKSPACE/site/dist"
          fi
          echo "Web-Root: $ROOT"
          # Ohne diese Prüfung liefe Playwright grün gegen ein leeres
          # Verzeichnis — ein Lauf, der nichts geprüft hat, sähe aus wie ein
          # bestandener. Lieber laut abbrechen als still nichts tun.
          if [ ! -f "$ROOT/index.html" ]; then
            echo "::error::Kein index.html in $ROOT — der Build hat nichts ausgeliefert."
            ls -la "$ROOT" || true
            exit 1
          fi
          # grep -o, NICHT grep -c: Astro schreibt die Sitemap auf EINE Zeile.
          # `grep -c` zaehlt Zeilen und meldete deshalb ausnahmslos 1 — auch bei
          # 46 URLs. Ein Zaehlwert, der nie etwas anderes werden kann, ist keine
          # Messung, und die Null-Warnung darunter waere nie gefeuert.
          # `|| true` ist noetig, NICHT Zierde: der Schritt laeuft mit
          # `set -euo pipefail`, und grep endet mit Code 1 (nichts gefunden)
          # bzw. 2 (Datei fehlt). Ohne den Auffang bricht der Schritt genau
          # dann ab, wenn die Warnung darunter greifen SOLLTE — gemessen am
          # 28.08.2026 an customer-herztoene, das keine Sitemap-Integration
          # hat: Exit 2, Lauf rot, Warnung nie ausgegeben.
          SEITEN=$( { grep -o '<loc>' "$ROOT/sitemap-0.xml" 2>/dev/null || true; } | wc -l | tr -d ' ')
          SEITEN=${SEITEN:-0}
          echo "Seiten in der Sitemap: $SEITEN"
          if [ "$SEITEN" -eq 0 ]; then
            echo "::warning::sitemap-0.xml fehlt oder ist leer — die Guards prüfen dann nur / und /kontakt/."
          fi
          # Haertegrad der a11y-Pruefung. Default ist meldend; ein Repo, das
          # seinen Rueckstand abgearbeitet HAT, stellt sie hart, indem es die
          # Datei .github/a11y-blocking anlegt. Der Schalter liegt damit im
          # Kundenrepo — versioniert und begruendbar — statt als Sonderfassung
          # der Vorlage, die der naechste Rollout ueberschreiben wuerde.
          if [ -f "$GITHUB_WORKSPACE/site/.github/a11y-blocking" ]; then
            A11Y=hart
          else
            A11Y=meldend
          fi
          echo "a11y-Modus: $A11Y"
          echo "dir=$ROOT"      >> "$GITHUB_OUTPUT"
          echo "seiten=$SEITEN" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y"     >> "$GITHUB_OUTPUT"

      - name: Guard-Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
        working-directory: cw-core/checks

      - name: Chromium installieren
        run: pnpm exec playwright install chromium --with-deps
        working-directory: cw-core/checks

      # Harter Gate. Horizontaler Überstand und Bilder breiter als der Viewport
      # sind sichtbare Defekte auf dem Gerät, mit dem die meisten Besucher
      # kommen — kein Stilfehler.
      - name: Mobil-Prüfung (blockierend)
        run: |
          DIST_DIR='${{ steps.webroot.outputs.dir }}' \
          pnpm exec playwright test mobile-audit.spec.ts \
            --project=mobile --project=tablet
        working-directory: cw-core/checks

      # Per Default meldend, nicht blockierend. Grundlage ist eine Messung, keine
      # Vermutung: am 28.08.2026 wurden alle 23 Kundenrepos gebaut und geprueft —
      # a11y war in 19 von 22 rot, mit color-contrast als dominierender Ursache
      # (bei digital-direkt 150 von 158 Befunden). Ein Check, der am Rollout-Tag
      # flaechig rot steht, wird weggeklickt; genau so ist der Vorgaenger-Guard
      # hier gestorben (330 Laeufe seit dem 26.04.2026, kein einziger gruen).
      #
      # Drei Repos waren schon gruen (donau-profi, pferdesport-silberhorn,
      # weinkontor-sinzing) — die Pruefung unterscheidet also, sie ist nicht
      # einfach ueberall rot.
      #
      # Wer seinen Rueckstand abgearbeitet hat, stellt sie hart: Datei
      # .github/a11y-blocking im Kundenrepo anlegen. Pro Repo, mit eigenem
      # Belegstand — nicht pauschal fuer die Flotte.
      - name: Barrierefreiheit
        continue-on-error: ${{ steps.webroot.outputs.a11y != 'hart' }}
        run: |
          DIST_DIR='${{ steps.webroot.outputs.dir }}' \
          pnpm exec playwright test a11y-audit.spec.ts \
            --project=mobile --project=tablet
        working-directory: cw-core/checks

      - name: Befunde als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks-${{ github.run_number }}
          path: cw-core/checks/test-results/
          if-no-files-found: ignore
          retention-days: 7
