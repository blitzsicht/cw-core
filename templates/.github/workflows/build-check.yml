# Build Check — Customer-Website CI
#
# Purpose: Fail fast on lockfile drift or broken builds, independent of Vercel.
# Mirror of what Vercel does at deploy time (pnpm install --frozen-lockfile + pnpm build),
# but runs on every push/PR and is visible as a red/green check on the commit BEFORE Vercel triggers.
#
# Template location: cw-core/templates/.github/workflows/build-check.yml
# Rolled out to: all 9 customer-* repos via scripts/rollout-build-check.sh
# Runtime: ~60–90s per run (Node+pnpm cache hits)
#
# If this workflow is red but Vercel is green, something is off — investigate immediately.
# If this workflow is red and Vercel is red, the lockfile was committed stale. Run:
#   pnpm install && git add pnpm-lock.yaml && git commit --amend --no-edit && git push -f

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version stammt aus package.json `packageManager`-Feld (pnpm@10.0.0).
        # Doppelte `with: version:`-Definition löst seit action-setup@v4
        # ERR_PNPM_BAD_PM_VERSION aus (siehe siluri/blitzsicht-ops#246).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen-lockfile — must match Vercel behavior exactly)
        run: pnpm install --frozen-lockfile

      - name: Validate CSP (harter Gate — blockt 'self'-ohne-Origin / fehlende Härtung)
        # Verhindert das DD-/donau-profi-CSP-Mystery: 'self' allein bricht
        # same-origin Assets in Chrome/Edge/Safari. exit 1 → CI rot VOR Vercel-Deploy.
        # Fix bei rot: node node_modules/@cw/core/scripts/gen-vercel-csp.mjs + commit.
        # Guard: Repos ohne @cw/core (noch nicht migriert, z.B. gympanzen/herztoene)
        # skippen statt MODULE_NOT_FOUND — Gate bleibt hart, sobald @cw/core da ist.
        run: |
          if [ -f node_modules/@cw/core/scripts/validate-csp.mjs ]; then
            node node_modules/@cw/core/scripts/validate-csp.mjs
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi

      - name: Validate Form-Backend (harter Gate — kein totes Kontaktformular)
        # Vorfall 2026-06-10: Formular postet an /api/contact, aber Route fehlte → 404,
        # still tot. exit 1 wenn ein Formular an /api/contact postet ohne /api/contact.ts.
        run: |
          if [ -f node_modules/@cw/core/scripts/validate-form-backend.mjs ]; then
            node node_modules/@cw/core/scripts/validate-form-backend.mjs
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi

      - name: Validate Conversion-Store (Ads-Sites — keine still verlorenen Conversions)
        # Greift nur, wenn eine Seite adsConsent an die ContactForm übergibt.
        # recordConversion() ist bewusst fail-open: fehlt der Neon-Treiber,
        # schluckt der try/catch den Import-Fehler und die Conversions
        # verschwinden lautlos (digital-direkt 2026-07-30).
        run: |
          if [ -f node_modules/@cw/core/scripts/validate-conversion-store.mjs ]; then
            node node_modules/@cw/core/scripts/validate-conversion-store.mjs
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi

      - name: Build
        run: pnpm build

      - name: Touchpoint-Audit (dist — tel:/mailto:/WhatsApp gegen SSOT, kein kaputter Kontaktweg)
        # Anlass digital-direkt 2026-07: Homepage-CTA wählte tel:+4994015395900
        # (Durchwahl 00 statt 0) — vor Google-Ads-Spend entdeckt. Prüft jede
        # tel:/mailto:/wa.me-Href im gebauten HTML gegen src/data/site-data.ts.
        # Optionale Allowlist/Extras: touchpoint-audit.config.json im Repo-Root.
        # Opt-out: Repository-Variable SKIP_TOUCHPOINTS=true.
        run: |
          if [ -f node_modules/@cw/core/scripts/verify-touchpoints.mjs ]; then
            node node_modules/@cw/core/scripts/verify-touchpoints.mjs --dist dist
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi
        env:
          SKIP_TOUCHPOINTS: ${{ vars.SKIP_TOUCHPOINTS }}

      - name: CSP-Output-Check (prüft die CSP gegen das GEBAUTE dist/)
        # Der validate-csp-Schritt oben prüft den CSP-*Text* gegen bekannte
        # Fehlermuster und kann darum nur Brüche fangen, die schon einmal live
        # waren. gympanzen (22.07.2026) bestand ihn mit 0 Issues und war fünf
        # Tage lang komplett ungestylt live: inlineStylesheets:'always' erzeugt
        # einen <style>-Block, den "style-src-elem 'self'" verwirft.
        #
        # Dieser Schritt vergleicht die CSP mit dem, was der Build tatsächlich
        # ausliefert. Redundant zum harten Abbruch im astro:build:done-Hook
        # (der greift schon in `pnpm build` oben) — bewusst: der Hook schützt
        # Produktion, dieser Schritt macht den Fehler im PR sichtbar, auch wenn
        # ein Repo den Guard per checkOutputCsp:false abgeschaltet hat.
        run: |
          if [ -f node_modules/@cw/core/scripts/csp-audit-dist.mjs ]; then
            node node_modules/@cw/core/scripts/csp-audit-dist.mjs
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi

  # ─── Form Health Smoke-Test ─────────────────────────────────────────────
  # Läuft NUR auf main nach Vercel-Auto-Deploy. Verifiziert dass /kontakt/
  # mit Turnstile-Widget ausgeliefert wird und /api/contact nicht crasht.
  # Catcht Bugs wie "PUBLIC_TURNSTILE_SITE_KEY vergessen", die Build-Check
  # nicht entdeckt (Build wäre grün, Form wäre still kaputt).
  #
  # Repository-Variable PRODUCTION_URL setzen (gh variable set PRODUCTION_URL).
  # Falls die Variable nicht gesetzt ist, wird der Job geskippt.
  # SKIP_FORM_HEALTH='true' setzen für Customer ohne ContactForm (phone-/whatsapp-only).
  smoke-test:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_URL != '' && vars.SKIP_FORM_HEALTH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version stammt aus package.json `packageManager`-Feld (pnpm@10.0.0).
        # Doppelte `with: version:`-Definition löst seit action-setup@v4
        # ERR_PNPM_BAD_PM_VERSION aus (siehe siluri/blitzsicht-ops#246).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (just the cw-core script)
        run: pnpm install --frozen-lockfile

      - name: Wait for Vercel deploy propagation
        run: sleep 60

      - name: Run form-health smoke-test
        run: node node_modules/@cw/core/scripts/verify-form-health.mjs
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          WAIT_MS: 0

      - name: Touchpoint-Audit (live — Links/Redirects/Plausible/Form-Kette)
        # --skip-empty-post: verify-form-health hat oben schon 1 POST auf
        # /api/contact gemacht; das Rate-Limit ist 3 POSTs/10min pro IP.
        # Der Audit macht so nur den Honeypot-Trip (Summe 2/3) und wertet
        # 429 als RATE_LIMITED-Warnung statt FAIL.
        run: |
          if [ -f node_modules/@cw/core/scripts/verify-touchpoints.mjs ]; then
            node node_modules/@cw/core/scripts/verify-touchpoints.mjs --url "${{ vars.PRODUCTION_URL }}" --skip-empty-post
          else
            echo "skip: kein @cw/core installiert — Repo noch nicht auf cw-core migriert"
          fi
        env:
          SKIP_TOUCHPOINTS: ${{ vars.SKIP_TOUCHPOINTS }}
